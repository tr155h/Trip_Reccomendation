<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlanMyTrip - Create Trip</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #4b79a1, #283e51);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.28);
    }
    h1 {
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: 1px;
    }
    .subtitle {
      margin: 8px 0 24px;
      opacity: 0.85;
    }
    .card h2 {
      margin-top: 0;
    }
    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
    }
    input[type="text"],
    input[type="number"],
    select {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      background: #ff8c42;
      color: #111;
    }
    button:hover {
      background: #ff7a20;
    }
    p.hint {
      margin: 16px 0 0;
      font-size: 0.95rem;
      opacity: 0.9;
    }
    p.message {
      margin: 16px 0 0;
      font-size: 0.95rem;
      color: #ffe7e7;
    }
    .back-link {
      display: inline-block;
      margin-top: 16px;
      color: #fff;
      text-decoration: none;
      opacity: 0.8;
      transition: opacity 0.2s ease;
    }
    .back-link:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PlanMyTrip</h1>
    <p class="subtitle">Plan Smart. Travel Better.</p>

    <div class="card">
      <h2>Create a New Trip</h2>
      <p>Give your trip a name to get started.</p>

      <form action="{{ url_for('create_trip') }}" method="post">
        <label for="tripName">Trip Name</label>
        <input
          id="tripName"
          name="tripName"
          type="text"
          placeholder="e.g., Paris 2026, Japan Adventure"
          required
          autofocus
        />

        <button type="submit">Create Trip</button>
      </form>

      {% if error %}
        <p class="message">{{ error }}</p>
      {% endif %}

      <a href="{{ url_for('profile') }}" class="back-link">← Back to Profile</a>
    </div>
  </div>
</body>
</html>
